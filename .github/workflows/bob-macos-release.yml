name: Bob release artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Bob prerelease tag identifying the exact source
        required: true
        default: v0.47.0-bob.2.2
      source_sha:
        description: Exact source commit the tag must identify
        required: true
        default: 8823ce27240abacf3ddac4214db70a266941f82e
      operating_system:
        description: Release operating system
        type: choice
        options: [linux, darwin, windows]
        default: linux
      architecture:
        description: Native release architecture
        type: choice
        options: [amd64, arm64]
        default: amd64

permissions:
  contents: read

concurrency:
  group: bob-release-${{ inputs.release_tag || 'v0.47.0-bob.2.2' }}
  cancel-in-progress: false

env:
  GOFLAGS: -trimpath
  GOPROXY: 'https://proxy.golang.org|direct'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(format('[{{"os":"{0}","arch":"{1}"}}]', inputs.operating_system, inputs.architecture)) }}
    env:
      RELEASE_ARCH: ${{ matrix.arch }}
      RELEASE_OS: ${{ matrix.os }}
      WHEEL_ARCH: ${{ matrix.arch == 'amd64' && 'x86_64' || 'arm64' }}
    runs-on: ${{ matrix.os == 'linux' && (matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest') || (matrix.os == 'windows' && (matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest') || (matrix.arch == 'amd64' && 'macos-15-intel' || 'macos-26')) }}
    container: ${{ matrix.os == 'linux' && (matrix.arch == 'arm64' && 'quay.io/pypa/manylinux_2_28_aarch64@sha256:ca1f9d96910e129d38f999644a1f211a6cdb4147da9f19157a49d72c5092453a' || 'quay.io/pypa/manylinux_2_28_x86_64@sha256:853663dc8253b62be437bb52a5caecffd020792af4442f55d927d22e0ea795ae') || '' }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.params.outputs.tag }}
      source: ${{ steps.params.outputs.source }}
      package: ${{ steps.params.outputs.package }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: automation
          persist-credentials: false

      - name: Use manylinux Python
        if: env.RELEASE_OS == 'linux'
        run: echo /opt/python/cp313-cp313/bin >> "$GITHUB_PATH"

      - uses: actions/setup-python@v7.1.0
        if: env.RELEASE_OS != 'linux'
        with:
          python-version: '3.13'

      - name: Select platform artifact names
        run: |
          python - <<'PY'
          import os, runpy
          platform = runpy.run_path('automation/scripts/bob_release.py')['platform_parameters'](os.environ['RELEASE_ARCH'], os.environ['RELEASE_OS'])
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in [('WHEEL_TAG', platform['wheel_tag']), ('BUILD_MANIFEST', platform['build_name']), ('CHECKSUM_MANIFEST', platform['manifest']), ('ARCHIVE_SUFFIX', platform['archive_suffix'])]:
                  print(f'{key}={value}', file=output)
          PY

      - name: Validate release target
        id: params
        env:
          REQUESTED_TAG: ${{ inputs.release_tag || 'v0.47.0-bob.2.2' }}
          REQUESTED_SOURCE: ${{ inputs.source_sha || '8823ce27240abacf3ddac4214db70a266941f82e' }}
        run: python automation/scripts/bob_release.py prepare --tag "$REQUESTED_TAG" --source "$REQUESTED_SOURCE"

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.params.outputs.tag }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Trust isolated container checkouts
        if: env.RELEASE_OS == 'linux'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/source"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/automation"

      - name: Verify immutable source ancestry
        working-directory: source
        env:
          SOURCE_SHA: ${{ steps.params.outputs.source }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor 8823ce27240abacf3ddac4214db70a266941f82e HEAD
          git merge-base --is-ancestor ef43f625641297f7818749c48760b46db1afab8a HEAD

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: source/go.mod
          cache: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json


      - name: Build native Linux release binary
        if: env.RELEASE_OS == 'linux'
        working-directory: source
        env:
          RELEASE_TAG: ${{ steps.params.outputs.tag }}
          SOURCE_SHA: ${{ steps.params.outputs.source }}
          CGO_ENABLED: '1'
          DO_NOT_TRACK: '1'
        run: |
          set -euo pipefail
          test "$(go env GOHOSTARCH)" = "$RELEASE_ARCH"
          test "$(go env GOARCH)" = "$RELEASE_ARCH"
          test "$(go env GOOS)" = linux
          test "$(uname -m)" = "$([ "$RELEASE_ARCH" = arm64 ] && echo aarch64 || echo x86_64)"
          make release VERSION="$RELEASE_TAG" COMMIT="$SOURCE_SHA" \
            POSTHOG_PROJECT_KEY= DISTRIBUTION=d3f0
          mv "dist/agentsview-linux-${RELEASE_ARCH}" dist/agentsview
          objdump -T dist/agentsview > dist/elf-symbols.txt
          python - <<'PY'
          import re
          from pathlib import Path
          versions = [tuple(map(int, version.split('.'))) for version in re.findall(r'\bGLIBC_(\d+(?:\.\d+)+)', Path('dist/elf-symbols.txt').read_text())]
          assert versions and max(versions) <= (2, 28), versions
          highest = '.'.join(map(str, max(versions)))
          print('Highest required glibc: ' + highest)
          Path('dist/glibc-max.txt').write_text(highest)
          PY

      - name: Build native macOS release binary
        if: env.RELEASE_OS == 'darwin'
        working-directory: source
        env:
          RELEASE_TAG: ${{ steps.params.outputs.tag }}
          SOURCE_SHA: ${{ steps.params.outputs.source }}
          PACKAGE_VERSION: ${{ steps.params.outputs.package }}
          CGO_ENABLED: '1'
          MACOSX_DEPLOYMENT_TARGET: '13.0'
          DO_NOT_TRACK: '1'
        run: |
          set -euo pipefail
          test "$(go env GOHOSTARCH)" = "$RELEASE_ARCH"
          test "$(uname -m)" = "$WHEEL_ARCH"
          make "release-darwin-${RELEASE_ARCH}" VERSION="$RELEASE_TAG" COMMIT="$SOURCE_SHA" \
            POSTHOG_PROJECT_KEY= DISTRIBUTION=d3f0
          mv "dist/agentsview-darwin-${RELEASE_ARCH}" dist/agentsview
          codesign --force --sign - dist/agentsview
          codesign --verify --strict dist/agentsview
          test "$(lipo -archs dist/agentsview)" = "$WHEEL_ARCH"
          otool -l dist/agentsview > dist/macho-load-commands.txt
          python - <<'PY'
          import re
          from pathlib import Path
          versions = re.findall(r"\bminos\s+(\d+(?:\.\d+)+)", Path("dist/macho-load-commands.txt").read_text())
          assert versions and all(tuple(map(int, version.split("."))) == (13, 0) for version in versions), versions
          PY

      - name: Setup MinGW for Windows AMD64
        if: env.RELEASE_OS == 'windows' && env.RELEASE_ARCH == 'amd64'
        id: msys2
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc make
          path-type: inherit

      - name: Select Windows AMD64 compiler
        if: env.RELEASE_OS == 'windows' && env.RELEASE_ARCH == 'amd64'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $bin = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin'
          $cc = Join-Path $bin 'gcc.exe'
          if (-not (Test-Path $cc)) { throw "Missing compiler: $cc" }
          $bin >> $env:GITHUB_PATH
          (Join-Path $env:MSYS2_LOCATION 'usr\bin') >> $env:GITHUB_PATH
          "CC=$($cc.Replace('\', '/'))" >> $env:GITHUB_ENV

      - name: Install make for Windows ARM64
        if: env.RELEASE_OS == 'windows' && env.RELEASE_ARCH == 'arm64'
        shell: pwsh
        run: |
          choco install make --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'make installation failed' }

      - name: Setup pinned llvm-mingw for Windows ARM64
        if: env.RELEASE_OS == 'windows' && env.RELEASE_ARCH == 'arm64'
        shell: pwsh
        env:
          LLVM_MINGW_VERSION: '20260602'
          LLVM_MINGW_NAME: llvm-mingw-20260602-ucrt-aarch64
          LLVM_MINGW_SHA256: cb5c20fbe1808e31ada5cbe4efd9daa2fee19c91dac6ec5ca1ac46a9c7247e37
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$env:LLVM_MINGW_NAME.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:LLVM_MINGW_SHA256) { throw 'llvm-mingw checksum mismatch' }
          7z x $zip -o"$env:RUNNER_TEMP" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'llvm-mingw extraction failed' }
          $bin = Join-Path $env:RUNNER_TEMP "$env:LLVM_MINGW_NAME\bin"
          $cc = Join-Path $bin 'aarch64-w64-mingw32-clang.exe'
          if (-not (Test-Path $cc)) { throw "Missing compiler: $cc" }
          $bin >> $env:GITHUB_PATH
          "CC=$($cc.Replace('\', '/'))" >> $env:GITHUB_ENV

      - name: Build native Windows release binary
        if: env.RELEASE_OS == 'windows'
        working-directory: source
        env:
          RELEASE_TAG: ${{ steps.params.outputs.tag }}
          SOURCE_SHA: ${{ steps.params.outputs.source }}
          CGO_ENABLED: '1'
          DO_NOT_TRACK: '1'
        run: |
          set -euo pipefail
          test "$(go env GOHOSTARCH)" = "$RELEASE_ARCH"
          test "$(go env GOARCH)" = "$RELEASE_ARCH"
          test "$(go env GOOS)" = windows
          command -v make
          "$CC" --version
          make sqlite-vec-header
          export CGO_CFLAGS="-O2 -g -I$(pwd -W)/.sqlite-include"
          make release VERSION="$RELEASE_TAG" COMMIT="$SOURCE_SHA" \
            CGO_CFLAGS="$CGO_CFLAGS" POSTHOG_PROJECT_KEY= DISTRIBUTION=d3f0
          mv "dist/agentsview-windows-${RELEASE_ARCH}" dist/agentsview.exe

      - name: Package native binary and wheel
        working-directory: source
        env:
          PACKAGE_VERSION: ${{ steps.params.outputs.package }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_OS" = windows ]; then
            ./dist/agentsview.exe --version
          else
            ./dist/agentsview --version
          fi
          mkdir artifacts
          python - <<'PY'
          import os, runpy, tarfile, zipfile
          from pathlib import Path
          archive = Path('artifacts') / f"agentsview_{os.environ['PACKAGE_VERSION']}_{os.environ['RELEASE_OS']}_{os.environ['RELEASE_ARCH']}.{os.environ['ARCHIVE_SUFFIX']}"
          if os.environ['RELEASE_OS'] == 'windows':
              with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED) as output:
                  output.write('dist/agentsview.exe', 'agentsview.exe')
          else:
              with tarfile.open(archive, 'w:gz') as output:
                  output.add('dist/agentsview', arcname='agentsview')
          builder = runpy.run_path("scripts/build_wheels.py")
          builder["PLATFORM_MAP"][os.environ["RELEASE_OS"] + "_" + os.environ["RELEASE_ARCH"]]["wheel_tag"] = os.environ["WHEEL_TAG"]
          builder["build_all_wheels"](Path("artifacts"), Path("artifacts"), os.environ["PACKAGE_VERSION"], Path("README.md").read_text())
          PY

      - name: Smoke-check exact wheel and release contracts
        working-directory: source
        env:
          RELEASE_TAG: ${{ steps.params.outputs.tag }}
          SOURCE_SHA: ${{ steps.params.outputs.source }}
          PACKAGE_VERSION: ${{ steps.params.outputs.package }}
          DO_NOT_TRACK: '1'
          AGENTSVIEW_NO_DAEMON: '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, tempfile, time, urllib.request, venv
          from pathlib import Path
          smoke = Path(os.environ['RUNNER_TEMP']) / 'bob-wheel-smoke'
          venv.create(smoke, with_pip=True)
          scripts = smoke / ('Scripts' if os.name == 'nt' else 'bin')
          interpreter = scripts / ('python.exe' if os.name == 'nt' else 'python')
          subprocess.run([str(interpreter), '-m', 'pip', 'install', '--no-deps', f"artifacts/agentsview-{os.environ['PACKAGE_VERSION']}-py3-none-{os.environ['WHEEL_TAG']}.whl"], check=True)
          binary = str(scripts / ('agentsview.exe' if os.name == 'nt' else 'agentsview'))
          version = subprocess.check_output([binary, "--version"], text=True)
          print(version)
          assert os.environ["RELEASE_TAG"] in version and os.environ["SOURCE_SHA"] in version
          for args, marker in [(["replica","pg","service","start","--help"], "Start the auto-push"), (["replica","pg","service","stop","--help"], "Stop the auto-push"), (["replica","pg","push","--help"], "--watch")]:
              assert marker in subprocess.check_output([binary,*args],text=True)
          home = Path(tempfile.mkdtemp())
          env = os.environ.copy()
          env.update(HOME=str(home), USERPROFILE=str(home), AGENTSVIEW_DATA_DIR=str(home / "archive"))
          process = subprocess.Popen([binary,"serve","--host","127.0.0.1","--port","17439","--no-browser","--no-sync","--no-update-check"],env=env)
          try:
              for _ in range(60):
                  try:
                      info = json.load(urllib.request.urlopen("http://127.0.0.1:17439/api/v1/version",timeout=2))
                      break
                  except OSError:
                      if process.poll() is not None: raise RuntimeError("Smoke server exited")
                      time.sleep(1)
              else: raise RuntimeError("Smoke server did not become ready")
              assert info["api_version"] == 15 and info["data_version"] == 169
              assert info["commit"] == os.environ["SOURCE_SHA"]
              print(json.dumps(info))
          finally:
              process.terminate()
              process.wait(timeout=30)
          build = {"tag":os.environ["RELEASE_TAG"],"source_sha":os.environ["SOURCE_SHA"],"workflow_sha":os.environ["GITHUB_SHA"],"package_version":os.environ["PACKAGE_VERSION"],"api_version":15,"data_version":169,"architecture":os.environ["RELEASE_ARCH"],"wheel_runtime":version.strip()}
          if os.environ['RELEASE_OS'] == 'linux':
              build['glibc_max'] = Path('dist/glibc-max.txt').read_text().strip()
          elif os.environ['RELEASE_OS'] == 'darwin':
              build['minos'] = '13.0'
          Path("artifacts", os.environ["BUILD_MANIFEST"]).write_text(json.dumps(build,indent=2)+"\n")
          PY
          make sqlite-vec-header
          if [ "$RELEASE_OS" = windows ]; then
            export CGO_CFLAGS="-O2 -g -I$(pwd -W)/.sqlite-include"
          else
            export CGO_CFLAGS="-O2 -g -I${PWD}/.sqlite-include"
          fi
          CGO_ENABLED=1 go test -tags fts5 ./internal/parser ./internal/config -run Bob -count=1
          CGO_ENABLED=1 go test -tags fts5 ./internal/sync -run 'TestBobRelease|TestBobVersionUpgrade' -count=1
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          directory = Path('artifacts')
          files = sorted(path for path in directory.iterdir() if path.name != os.environ['CHECKSUM_MANIFEST'])
          (directory / os.environ['CHECKSUM_MANIFEST']).write_text(''.join(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n' for path in files))
          PY

      - name: Verify complete artifact gate
        env:
          RELEASE_TAG: ${{ steps.params.outputs.tag }}
          SOURCE_SHA: ${{ steps.params.outputs.source }}
        run: python automation/scripts/bob_release.py verify --tag "$RELEASE_TAG" --source "$SOURCE_SHA" --architecture "$RELEASE_ARCH" --os "$RELEASE_OS" --directory source/artifacts

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bob-${{ env.RELEASE_OS }}-${{ env.RELEASE_ARCH }}-release
          path: source/artifacts/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: automation
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          name: bob-${{ inputs.operating_system }}-${{ inputs.architecture }}-release
          path: artifacts

      - name: Publish verified artifacts without overwriting existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_SHA: ${{ needs.build.outputs.source }}
          RELEASE_OS: ${{ inputs.operating_system }}
          RELEASE_ARCH: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          command=append
          if [ "$RELEASE_OS" = darwin ] && [ "$RELEASE_ARCH" = arm64 ]; then
            command=publish
          fi
          python automation/scripts/bob_release.py "$command" --tag "$RELEASE_TAG" --source "$SOURCE_SHA" \
            --architecture "$RELEASE_ARCH" --os "$RELEASE_OS" --directory artifacts
